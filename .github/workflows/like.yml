name: ZEEHO 每日点赞

on:
  schedule:
    # 每天 08:50（北京时间）= 00:50 UTC，避开 08:30 的签到任务
    - cron: "50 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: false
        default: "like"
        type: choice
        options:
          - "like"
          - "status-only"
          - "dry-run"
          - "resolve-uid"
      community:
        description: "自己没发帖时，允许点赞公共动态"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  like:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 执行每日点赞
        env:
          ZEEHO_TOKENS: ${{ secrets.ZEEHO_TOKENS }}
          ZEEHO_USER_IDS: ${{ secrets.ZEEHO_USER_IDS }}
          ENABLE_COMMUNITY_LIKE: ${{ github.event.inputs.community }}
          NOTIFY_BARK: ${{ secrets.NOTIFY_BARK }}
          NOTIFY_SERVERCHAN: ${{ secrets.NOTIFY_SERVERCHAN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then
            echo "::notice::dry-run 模式：只做本地自检，不联网、不发请求"
            ZEEHO_TOKENS="${ZEEHO_TOKENS:-demo-token-0000-0000:1234567}" python zeeho_like.py --dry-run
            exit 0
          fi

          if [ -z "${ZEEHO_TOKENS}" ]; then
            echo "::error::未配置 secrets.ZEEHO_TOKENS。直接填签到用的纯 token 即可，userId 可选"
            exit 1
          fi

          EXTRA=""
          case "${{ github.event.inputs.mode }}" in
            status-only)  EXTRA="--status-only" ;;
            resolve-uid)  EXTRA="--resolve-uid" ;;
            *)            EXTRA="--spread-seconds 600" ;;
          esac

          if [ "${{ github.event.inputs.community }}" = "true" ]; then
            EXTRA="$EXTRA --community"
          fi

          python zeeho_like.py $EXTRA || {
            code=$?
            echo "::warning::zeeho_like.py 退出码 $code（2 通常表示没有可点赞的动态）"
            exit 0
          }
