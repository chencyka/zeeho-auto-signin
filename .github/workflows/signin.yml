name: ZEEHO 每日签到

on:
  schedule:
    # 每天 08:30（北京时间）= 00:30 UTC
    # GitHub Actions 的 cron 使用 UTC 时区
    - cron: "30 0 * * *"
  workflow_dispatch:
    # 允许在 Actions 页面手动触发，便于测试
    inputs:
      status_only:
        description: "只查状态，不签到"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 执行签到
        env:
          ZEEHO_TOKENS: ${{ secrets.ZEEHO_TOKENS }}
          # 可选：推送通知（不配则只写日志和 Summary）
          NOTIFY_BARK: ${{ secrets.NOTIFY_BARK }}
          NOTIFY_SERVERCHAN: ${{ secrets.NOTIFY_SERVERCHAN }}
        run: |
          if [ -z "${ZEEHO_TOKENS}" ]; then
            echo "::error::未配置 secrets.ZEEHO_TOKENS，请在仓库 Settings → Secrets and variables → Actions 中添加"
            exit 1
          fi
          EXTRA=""
          if [ "${{ github.event.inputs.status_only }}" = "true" ]; then
            EXTRA="--status-only"
          fi
          python zeeho_signin.py $EXTRA

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signin-log-${{ github.run_number }}
          path: |
            *.log
          retention-days: 7
          if-no-files-found: ignore
