name: ZEEHO 每日自动化

on:
  schedule:
    # 每天 08:30（北京时间）= 00:30 UTC
    # GitHub Actions 的 cron 使用 UTC 时区
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: false
        default: "run"
        type: choice
        options:
          - "run"           # 先签到，后互动（默认）
          - "signin-only"   # 只签到
          - "interact-only" # 只互动
          - "status-only"   # 只查状态
          - "dry-run"       # 只自检，不联网
          - "resolve-uid"   # 自助获取 userId
      community:
        description: "自己没动态时，允许点赞公共动态"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 执行（先签到，后互动）
        env:
          ZEEHO_TOKENS: ${{ secrets.ZEEHO_TOKENS }}
          ZEEHO_USER_IDS: ${{ secrets.ZEEHO_USER_IDS }}
          ZEEHO_POST_ID: ${{ secrets.ZEEHO_POST_ID }}
          ZEEHO_POST_CONTENT: ${{ secrets.ZEEHO_POST_CONTENT }}
          INTERACT_STEPS: ${{ secrets.INTERACT_STEPS }}
          ENABLE_COMMUNITY_LIKE: ${{ github.event.inputs.community }}
          NOTIFY_BARK: ${{ secrets.NOTIFY_BARK }}
          NOTIFY_SERVERCHAN: ${{ secrets.NOTIFY_SERVERCHAN }}
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode }}"

          if [ "$MODE" = "dry-run" ]; then
            echo "::notice::dry-run 模式：只做本地自检，不联网、不发请求"
            ZEEHO_TOKENS="${ZEEHO_TOKENS:-demo-token-0000-0000:1234567}" python zeeho.py --dry-run
            exit 0
          fi

          if [ -z "${ZEEHO_TOKENS}" ]; then
            echo "::error::未配置 secrets.ZEEHO_TOKENS。直接填签到用的纯 token 即可"
            exit 1
          fi

          EXTRA="--spread-seconds 600"
          case "$MODE" in
            signin-only)  EXTRA="$EXTRA --signin-only" ;;
            interact-only) EXTRA="$EXTRA --interact-only" ;;
            status-only)  EXTRA="$EXTRA --status-only" ;;
            resolve-uid)  EXTRA="--resolve-uid" ;;
          esac

          if [ "${{ github.event.inputs.community }}" = "true" ]; then
            EXTRA="$EXTRA --community"
          fi

          python zeeho.py $EXTRA || {
            code=$?
            echo "::warning::zeeho.py 退出码 $code（2 表示有步骤未成功）"
            exit 0
          }
